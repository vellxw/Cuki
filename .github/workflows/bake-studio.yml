name: CUKI offline studio lighting asset
on:
  push:
    branches: [implementation/cuki-verified]
    paths: [.github/workflows/bake-studio.yml, ci/bake-studio-request.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cuki-studio-asset
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated build-time renderer, never a mobile dependency
        run: |
          mkdir -p /tmp/cuki-asset-tools
          npm install --prefix /tmp/cuki-asset-tools --no-audit --no-fund playwright@1.55.0
          node /tmp/cuki-asset-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Generate lighting from the owned geometric studio with no external images
        env:
          CUKI_PLAYWRIGHT_MODULE: /tmp/cuki-asset-tools/node_modules/playwright/index.mjs
        run: node scripts/assets/bake-studio.mjs
      - name: Preserve only the verified derived lighting assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/assets/studio-room-1.2.bin apps/mobile/assets/studio-room-1.2.json
          git diff --cached --quiet || git commit -m 'perf: preserve prefiltered studio lighting asset with hash and provenance [skip ci]'
          git fetch origin implementation/cuki-verified
          git rebase origin/implementation/cuki-verified
          git push origin HEAD:implementation/cuki-verified
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-studio-lighting-${{ github.sha }}
          path: |
            apps/mobile/assets/studio-room-1.2.bin
            apps/mobile/assets/studio-room-1.2.json
          retention-days: 30
          if-no-files-found: error
