name: CUKI native renderer startup isolation
on:
  push:
    branches: [implementation/cuki-verified]
    paths: [.github/workflows/render-isolation.yml, ci/render-isolation.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUKI_BINARY_SOURCE_SHA: 7b3f9972d578ce89cf729930858c20eba21cb2d4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cuki-android-binary-7b3f9972d578ce89cf729930858c20eba21cb2d4
          run-id: 35152098719
          github-token: ${{ github.token }}
          path: /tmp/cuki-prior-binary
      - run: |
          mkdir -p apps/mobile/android/app/build/outputs/apk/release
          source=/tmp/cuki-prior-binary/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          echo "fd81b32720c68ecd43beb100dfc045fcd69d6f72da0dcdf98421827300352a56  $source" | sha256sum -c -
          cp "$source" apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m venv /tmp/cuki-native-driver
          /tmp/cuki-native-driver/bin/python -m pip install uiautomator2==3.7.0
          echo /tmp/cuki-native-driver/bin >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: false
          script: |
            sleep 30
            timeout --signal=TERM --kill-after=15s 600s python3 scripts/native/android-render-isolation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-render-isolation-${{ github.sha }}
          path: artifacts/native/render-isolation
          retention-days: 30
          if-no-files-found: error
