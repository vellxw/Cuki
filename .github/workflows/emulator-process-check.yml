name: CUKI owned emulator process check
on:
  push:
    branches: [implementation/cuki-verified]
    paths: [.github/workflows/emulator-process-check.yml, ci/emulator-process-request.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cuki-owned-emulator
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gpu: [lavapipe, swangle]
    env:
      CUKI_BINARY_SOURCE_SHA: 7b3f9972d578ce89cf729930858c20eba21cb2d4
      ANDROID_SERIAL: emulator-5554
      ANDROID_USER_HOME: ${{ runner.temp }}/cuki-android-user
      ANDROID_AVD_HOME: ${{ runner.temp }}/cuki-android-user/avd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cuki-android-binary-7b3f9972d578ce89cf729930858c20eba21cb2d4
          run-id: 35152098719
          github-token: ${{ github.token }}
          path: /tmp/cuki-prior-binary
      - name: Locate installed SDK tools explicitly
        run: |
          sdk_bin="${ANDROID_HOME:?}/cmdline-tools/latest/bin"
          test -x "$sdk_bin/sdkmanager"
          test -x "$sdk_bin/avdmanager"
          echo "$sdk_bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Prepare the same verified test-only APK and fresh AVD
        run: |
          mkdir -p artifacts/native/emulator-process apps/mobile/android/app/build/outputs/apk/release
          source=/tmp/cuki-prior-binary/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          echo "fd81b32720c68ecd43beb100dfc045fcd69d6f72da0dcdf98421827300352a56  $source" | sha256sum -c -
          cp "$source" apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m venv /tmp/cuki-native-driver
          /tmp/cuki-native-driver/bin/python -m pip install uiautomator2==3.7.0
          echo /tmp/cuki-native-driver/bin >> "$GITHUB_PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install emulator platform-tools 'system-images;android-35;google_apis;x86_64' > artifacts/native/emulator-process/sdk-setup.log
          echo no | avdmanager create avd --force -n cuki-proof --package 'system-images;android-35;google_apis;x86_64' --device pixel_6 -p "$ANDROID_AVD_HOME/cuki-proof.avd"
          test -f "$ANDROID_AVD_HOME/cuki-proof.avd/config.ini"
          printf 'hw.cpu.ncore=2\nhw.ramSize=3072\nhw.heapSize=512\n' >> "$ANDROID_AVD_HOME/cuki-proof.avd/config.ini"
          emulator -list-avds | tee artifacts/native/emulator-process/available-avds.txt
          grep -Fx cuki-proof artifacts/native/emulator-process/available-avds.txt
          adb start-server
      - name: Run the real two-screen diagnostic while recording emulator exit and memory
        run: python3 scripts/native/owned-emulator.py --avd cuki-proof --gpu '${{ matrix.gpu }}' --driver android-render-isolation.py
      - name: Preserve source identity and host resource counters
        if: always()
        run: |
          mkdir -p artifacts/native/emulator-process
          git rev-parse HEAD > artifacts/native/emulator-process/HARNESS_COMMIT.txt
          free -h > artifacts/native/emulator-process/host-memory-final.txt
          df -h / > artifacts/native/emulator-process/host-disk-final.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-emulator-${{ matrix.gpu }}-${{ github.sha }}
          path: |
            artifacts/native/emulator-process
            artifacts/native/render-isolation
          retention-days: 30
          if-no-files-found: error
