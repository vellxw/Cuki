name: CUKI canonical iOS material verification
on:
  push:
    branches: [implementation/cuki-verified]
    paths: [.github/workflows/ios-canonical.yml, ci/ios-canonical-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuki-canonical-ios
  cancel-in-progress: true
env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_TEST_MODE: '1'
  EXPO_PUBLIC_VISUAL_FIXTURES: '1'
  EXPO_PUBLIC_API_URL: ''
  EXPO_PUBLIC_SUPABASE_URL: ''
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: python3 -m unittest discover -s tests/native -p 'test_*.py'
      - run: cd apps/mobile && npx --no-install expo prebuild --platform ios --no-install
      - run: cd apps/mobile/ios && pod install
      - run: ruby scripts/native/ios/add-ui-tests.rb --visual
      - name: Compile the actual native visual client and XCTest bundle
        run: |
          mkdir -p artifacts/native/visual-ios
          cd apps/mobile/ios
          set -o pipefail
          xcodebuild -workspace CUKIVisual.xcworkspace -scheme CUKIVisualCapture -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee ../../../artifacts/native/visual-ios/build.log
      - name: Create the canonical 390x844 device and assert each captured native scene
        run: python3 scripts/native/ios-visual.py
      - name: Preserve source and exact build identity regardless of outcome
        if: always()
        run: |
          mkdir -p artifacts/native/visual-ios
          git rev-parse HEAD > artifacts/native/visual-ios/COMMIT.txt
          git archive --format=zip HEAD > artifacts/native/visual-ios/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-canonical-ios-${{ github.sha }}
          path: artifacts/native/visual-ios
          retention-days: 30
          if-no-files-found: error
