name: CUKI unchanged APK Android compatibility
on:
  push:
    branches: [implementation/cuki-verified]
    paths: [.github/workflows/runtime-compatibility.yml, ci/runtime-compatibility.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CUKI_BINARY_SOURCE_SHA: 7b3f9972d578ce89cf729930858c20eba21cb2d4
      CUKI_EMULATOR_GPU: swiftshader-no-vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cuki-android-binary-7b3f9972d578ce89cf729930858c20eba21cb2d4
          run-id: 35152098719
          github-token: ${{ github.token }}
          path: /tmp/cuki-prior-binary
      - name: Verify unchanged APK and annotate compatibility scope
        run: |
          mkdir -p apps/mobile/android/app/build/outputs/apk/release artifacts/native/runtime-observed
          source=/tmp/cuki-prior-binary/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          echo "fd81b32720c68ecd43beb100dfc045fcd69d6f72da0dcdf98421827300352a56  $source" | sha256sum -c -
          cp "$source" apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          git rev-parse HEAD > artifacts/native/runtime-observed/HARNESS_COMMIT.txt
          printf '%s\n' "$CUKI_BINARY_SOURCE_SHA" > artifacts/native/runtime-observed/BINARY_COMMIT.txt
          printf '%s\n' 'API ${{ matrix.api }} google_apis image. Same compiled APK and test assertions. Compatibility diagnosis, not proof that API 36 AOSP is fixed.' > artifacts/native/runtime-observed/SCOPE.txt
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m venv /tmp/cuki-native-driver
          /tmp/cuki-native-driver/bin/python -m pip install uiautomator2==3.7.0
          echo /tmp/cuki-native-driver/bin >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 17
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072
          heap-size: 512
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: false
          script: timeout --signal=TERM --kill-after=15s 660s python3 scripts/native/android-observed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-runtime-api${{ matrix.api }}-${{ github.sha }}
          path: |
            artifacts/native/android
            artifacts/native/runtime-observed
          retention-days: 30
          if-no-files-found: error
