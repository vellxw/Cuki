name: CUKI native binary checks
on:
  push:
    branches: [implementation/cuki-verified]
    paths: [.github/workflows/native-build-check.yml, ci/native-request.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cuki-native-binary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_TEST_MODE: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: cd apps/mobile && npx --no-install expo prebuild --platform android --no-install
      - name: Compile an independently launchable Android test binary
        run: |
          cd apps/mobile/android
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a --no-daemon --max-workers=2 --stacktrace
      - name: Enable KVM for ephemeral emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: python3 scripts/native/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-android-binary-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            artifacts/native/android
          retention-days: 30
          if-no-files-found: warn
  ios:
    runs-on: macos-26
    timeout-minutes: 80
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: cd apps/mobile && npx --no-install expo prebuild --platform ios --no-install
      - run: cd apps/mobile/ios && pod install
      - name: Compile simulator application, without distribution signing
        run: |
          cd apps/mobile/ios
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          scheme=$(xcodebuild -list -json -workspace "$workspace" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Launch in native iOS simulator and capture Home
        run: |
          mkdir -p artifacts/native/ios
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if x.get("isAvailable") and "iPhone" in x["name"]))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          app=$(find apps/mobile/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.cuki.app.test
          sleep 12
          xcrun simctl openurl "$udid" 'cuki://home'
          sleep 8
          xcrun simctl io "$udid" screenshot artifacts/native/ios/home.png
          xcrun simctl list devices -j > artifacts/native/ios/devices.json
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/native/ios/CUKI-simulator.app.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-ios-simulator-${{ github.sha }}
          path: artifacts/native/ios
          retention-days: 30
          if-no-files-found: warn
