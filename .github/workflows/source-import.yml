name: CUKI verified source import
on:
  push:
    branches: [implementation/cuki-verified]
    paths: [.delivery/source.json]
permissions:
  contents: write
concurrency:
  group: cuki-source-import
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: implementation/cuki-verified
          fetch-depth: 0
      - name: Import intended-public source, verify bytes and safe paths
        run: |
          python3 - <<'PY'
          import json,hashlib,urllib.request,urllib.parse,tarfile,zipfile,io,pathlib,shutil
          root=pathlib.Path.cwd()
          spec=json.loads((root/'.delivery/source.json').read_text())
          url=spec['url']; parsed=urllib.parse.urlsplit(url)
          assert parsed.scheme=='https' and parsed.hostname.endswith('.oaiusercontent.com')
          print('::add-mask::'+url)
          data=urllib.request.urlopen(url,timeout=60).read(32*1024*1024+1)
          assert len(data)<=32*1024*1024
          assert hashlib.sha256(data).hexdigest()==spec['sha256'],'Archive checksum mismatch'
          def target(name):
              path=pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert not any(p in ('.git','node_modules','.expo') for p in path.parts)
              assert not (path.name.startswith('.env') and path.name!='.env.example')
              assert path.suffix not in ('.p12','.jks','.keystore','.mobileprovision','.db')
              if path.parts and path.parts[0]=='.github': return None
              return root/path
          count=0
          if spec['format']=='tar.gz':
              with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
                  for item in archive:
                      if item.isdir(): continue
                      assert item.isfile(),'Links and devices are forbidden'
                      dest=target(item.name)
                      if dest is None: continue
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(archive.extractfile(item).read()); count+=1
          else:
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  assert archive.testzip() is None
                  for item in archive.infolist():
                      if item.is_dir(): continue
                      assert (item.external_attr>>16)&0o170000 != 0o120000
                      dest=target(item.filename)
                      if dest is None: continue
                      dest.parent.mkdir(parents=True,exist_ok=True)
                      dest.write_bytes(archive.read(item)); count+=1
          assert (root/'apps/mobile/src/data/AppProvider.tsx').is_file()
          assert (root/'package-lock.json').is_file()
          (root/'.delivery/source.json').unlink()
          print(f'Imported {count} files with matching SHA-256. This is a source checkpoint, not a release.')
          PY
      - name: Preserve source immediately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'wip: preserve full recovered native source checkpoint [skip ci]'
          git push origin HEAD:implementation/cuki-verified
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Source archive from committed tree
        if: always()
        run: git archive --format=zip --output=cuki-source-checkpoint.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-recovered-source
          path: cuki-source-checkpoint.zip
          retention-days: 30
