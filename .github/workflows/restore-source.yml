name: CUKI restore and verify source
on:
  push:
    branches: [implementation/cuki-verified]
    paths: [.delivery/restore/manifest.json]
permissions:
  contents: write
concurrency:
  group: cuki-source-restoration
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact verified text source
        run: python3 .github/scripts/restore-source.py
      - name: Persist complete text source before dependencies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'wip: restore 59 checksum-verified source files [skip ci]'
          git push origin HEAD:implementation/cuki-verified
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Resolve lockfile from restored manifests
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Persist reproducible dependency lock
        run: |
          git add package-lock.json
          git diff --cached --quiet || git commit -m 'build: lock compatible native dependencies [skip ci]'
          git push origin HEAD:implementation/cuki-verified
      - run: npm ci --no-audit --no-fund
      - name: Current TypeScript check
        run: npm run typecheck
      - name: Archive exact committed source
        if: always()
        run: |
          mkdir -p /tmp/cuki-source
          git archive --format=zip HEAD > /tmp/cuki-source/source.zip
          git rev-parse HEAD > /tmp/cuki-source/COMMIT.txt
          sha256sum /tmp/cuki-source/source.zip > /tmp/cuki-source/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-source-restored
          path: /tmp/cuki-source
          retention-days: 30
          if-no-files-found: error
