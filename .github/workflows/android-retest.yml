name: CUKI exact APK native re-test
on:
  push:
    branches: [implementation/cuki-verified]
    paths: [ci/android-retest.json]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cuki-apk-retest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  retest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test native driver guards
        run: python3 -m unittest discover -s tests/native -p 'test_*.py'
      - name: Prove unchanged runtime and validate source build provenance
        id: input
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/prepare-apk-retest.py prepare
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.input.outputs.artifact }}
          run-id: ${{ steps.input.outputs.run }}
          github-token: ${{ github.token }}
          path: artifacts/retest-input
      - name: Verify exact binary checksum, do not rebuild or modify it
        run: python3 scripts/native/prepare-apk-retest.py install
      - name: Enable KVM for ephemeral emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned native accessibility driver
        run: |
          python3 -m venv /tmp/cuki-native-driver
          /tmp/cuki-native-driver/bin/python -m pip install uiautomator2==3.7.0
          echo /tmp/cuki-native-driver/bin >> "$GITHUB_PATH"
          mkdir -p artifacts/native/android
          /tmp/cuki-native-driver/bin/python -m pip freeze > artifacts/native/android/python-packages.txt
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          CUKI_BINARY_SOURCE_SHA: ${{ steps.input.outputs.source }}
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: python3 scripts/native/android-smoke.py
      - name: Preserve harness source separately from binary source
        if: always()
        run: |
          mkdir -p artifacts/native/android
          git rev-parse HEAD > artifacts/native/android/HARNESS_COMMIT.txt
          git archive --format=zip HEAD > artifacts/native/android/QA-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuki-android-retest-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            artifacts/native/android
          retention-days: 30
          if-no-files-found: error
